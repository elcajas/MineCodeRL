feature_net_kwargs:
  rgb_feat:
    cls: DummyImgFeat
    output_dim: 512
    image_model: gdino  # Image models: mineclip, gdino, hf_gdino, image_encoder
  compass:
    cls: CompassMLP
    input_dim: 4
    hidden_dim: 128
    output_dim: 128
    hidden_depth: 2
  gps:
    cls: GPSMLP
    hidden_dim: 128
    output_dim: 128
    hidden_depth: 2
  # voxels:
  #   cls: FlattenedVoxelBlockEncoder
  #   embed_dim: 8
