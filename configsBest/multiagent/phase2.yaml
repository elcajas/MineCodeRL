feature_net_kwargs:
  rgb_feat:
    cls: DummyImgFeat
    output_dim: 512
    image_model: gdino  # Image models: mineclip, gdino, hf_gdino, image_encoder
  compass:
    cls: CompassMLP
    input_dim: 4
    hidden_dim: 128
    output_dim: 128
    hidden_depth: 2
  gps:
    cls: GPSMLP
    hidden_dim: 128
    output_dim: 128
    hidden_depth: 2

feature_fusion:
  output_dim: 512
  hidden_depth: 0

actor:
  hidden_dim: 256
  hidden_depth: 3

critic:
  hidden_dim: 256
  hidden_depth: 3

mineclip:
  arch: "vit_base_p16_fz.v2.t2"
  hidden_dim: 512
  image_feature_dim: 512
  mlp_adapter_spec: "v0-2.t0"
  pool_type: "attn.d2.nh8.glusw"  # filled by variant
  resolution: [160, 256]
  ckpt:
    path:  /gs/fs/tga-openv/kenjic/documents/rlearning/weights/mineclip_weights/attn.pth # filled by users
    checksum: "b5ece9198337cfd117a3bfbd921e56da"

groundingdino:
  ckpt: /gs/fs/tga-openv/kenjic/documents/rlearning/weights/dino_weights/groundingdino_swint_ogc.pth # filled by user
  setfile: /gs/fs/tga-openv/kenjic/documents/rlearning/GroundingDINO/groundingdino/config/GroundingDINO_SwinT_OGC.py # filled by user

agent:
  task1: "combat zombie"
  task2: "combat spider"
  prompt1: "zombie . sky . mob . tree ."
  prompt2: "spider . sky . mob . tree ."
  num_envs: 1
  total_timesteps: 500000
  num_steps: 560
  num_minibatches: 10
  learning_epochs: 2
  clip_vloss: false
  return_norm: false

  load_ppo_model: true
  ppo_checkpoint_path: "/gs/fs/tga-openv/kenjic/documents/rlearning/MineCodeRL/results/only-ppo_gdino-multiagent/combat_zombie_combat_spider_12_23-20:22_multigpu/checkpoints/ppo_update_246.pth"
  load_image_model: false
  image_checkpoint_path: ""

  multigpu: true
  devices: 'all'
  train_image_model: true
  lora_rank: 64
  lora_alpha: 64

  autocast_flag: false
  cuda_number: 0
  server_name: "tsubame4"

  gamma: 0.99
  gae_lambda: 0.95
  seed: 1
  clip_coef: 0.2
  learning_rate: !!float 2e-6 #1e-4
  min_lr: !!float 1e-6
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 10
  target_kl: 0.015

debug: false

ppo_buffer:
  buffer_size: 15000
  number_actions: 89

si_buffer:
  buffer_size: 50
  buffer_mean: 0.1
  buffer_std: 0
  buffer_delta: 0

hyperparameters:
  task: ""
  epochs: 20
  batch_size: 5000

  video_min_rew: 32

  load_checkpoint: false
  checkpoint_dir: ""
  checkpoint_epoch: 0

  imitation_learning: false
  demos_path: ""
  
  file_logging: true
  wandb_init: true


